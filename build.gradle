buildscript {

    repositories {

        google()
        mavenCentral()
    }

    dependencies {

        classpath 'com.android.tools.build:gradle:9.4.0'
    }
}

allprojects {

    repositories {

        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven {
            url "https://artifactory.appodeal.com/appodeal-public"
        }
    }
}

tasks.register('clean', Delete) {

    delete rootProject.layout.buildDirectory
}
